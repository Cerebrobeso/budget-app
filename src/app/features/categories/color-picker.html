<hlm-popover align="start" sideOffset="6" [state]="state()" (stateChanged)="onStateChange($event)">
  <button
    hlmPopoverTrigger
    type="button"
    [attr.id]="buttonId() ?? null"
    class="group flex size-11 shrink-0 cursor-pointer items-center justify-center rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
    [attr.aria-label]="ariaLabel() ?? ('Colore: ' + color())"
  >
    <app-category-swatch [color]="color()" [icon]="icon()" />
  </button>

  <hlm-popover-content class="w-72" *hlmPopoverPortal="let ctx">
    <p class="mb-1.5 text-sm font-semibold uppercase tracking-wider text-muted-foreground">Colore</p>
    <div class="grid grid-cols-6 gap-2">
      @for (swatch of presets; track swatch) {
        <button
          type="button"
          class="relative size-7 shrink-0 cursor-pointer rounded-full border transition-transform hover:scale-110"
          [class]="isActive(swatch) ? 'border-foreground' : 'border-transparent'"
          [style.background]="swatch"
          [attr.title]="isUsed(swatch) ? swatch + ' — già usato da un\'altra categoria' : swatch"
          [attr.aria-label]="'Seleziona ' + swatch"
          (click)="choose(swatch)"
        >
          @if (isActive(swatch)) {
            <ng-icon name="lucideCheck" class="absolute inset-0 m-auto drop-shadow" size="14"
                     [class.text-white]="readableForeground(swatch) === 'white'" [class.text-black]="readableForeground(swatch) === 'black'" />
          } @else if (isUsed(swatch)) {
            <span class="absolute -end-0.5 -bottom-0.5 size-2.5 rounded-full border-2 border-popover bg-foreground/60"></span>
          }
        </button>
      }
    </div>

    <div class="mt-3 flex items-center gap-2 border-t border-border pt-3">
      <span
        class="size-6 shrink-0 rounded-full border border-dashed border-border"
        [style.background]="draftPreview() ?? 'transparent'"
      ></span>
      <input
        hlmInput
        class="h-8 flex-1 font-mono text-sm uppercase"
        type="text"
        aria-label="Colore in esadecimale"
        placeholder="#2E46D1"
        maxlength="7"
        [ngModel]="draft()"
        (ngModelChange)="onDraftChange($event)"
        (keydown.enter)="applyDraft()"
      />
    </div>

    <p class="mb-1.5 mt-3 border-t border-border pt-3 text-sm font-semibold uppercase tracking-wider text-muted-foreground">Icona (facoltativa)</p>
    <div class="grid grid-cols-6 gap-2">
      <button
        type="button"
        class="relative flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-md border bg-muted transition-transform hover:scale-110"
        [class]="icon() === null ? 'border-foreground' : 'border-transparent'"
        title="Nessuna icona"
        aria-label="Nessuna icona"
        (click)="chooseIcon(null)"
      >
        <ng-icon name="lucideX" size="18" class="text-muted-foreground" />
      </button>
      @for (name of icons; track name) {
        <button
          type="button"
          class="relative flex size-7 shrink-0 cursor-pointer items-center justify-center rounded-md border bg-muted transition-transform hover:scale-110"
          [class]="isActiveIcon(name) ? 'border-foreground' : 'border-transparent'"
          [attr.title]="iconLabel(name)"
          [attr.aria-label]="'Seleziona icona ' + iconLabel(name)"
          (click)="chooseIcon(name)"
        >
          <ng-icon [name]="name" size="18" />
        </button>
      }
    </div>
  </hlm-popover-content>
</hlm-popover>
